services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: lumora_cafe_v2
      DB_USER: lumora
      DB_PASS: lumora
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: lumora_cafe_v2
      MARIADB_USER: lumora
      MARIADB_PASSWORD: lumora
      MARIADB_ROOT_PASSWORD: lumora-root
    volumes:
      - db_data:/var/lib/mysql
      - ./database/lumora_cafe_v2.sql:/docker-entrypoint-initdb.d/01-lumora.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
